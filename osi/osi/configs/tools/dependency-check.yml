# OWASP Dependency-Check Vulnerability Scanner Configuration
# @author Ibrahim Matar
source: "https://github.com/jeremylong/DependencyCheck"
profiles:
  - schema: "cyclonedx"
    spec_version: "1.4"
    format: "json"
    languages:
      - "Java"
      - "JavaScript"
      - "Python"
      - ".NET"
      - "Ruby"
      - "PHP"
    package_managers:
      - "Maven"
      - "Gradle"
      - "NPM"
      - "Yarn"
      - "Pip"
      - "Composer"
      - "NuGet"
      - "Gem"
    commands:
      - "mkdir -p /tmp/dependency-check-data"
      - "if [ ! -f /tmp/dependency-check-data/odc.mv.db ]; then /opt/dependency-check/bin/dependency-check.sh --data /tmp/dependency-check-data --updateonly || true; fi"
      - "/opt/dependency-check/bin/dependency-check.sh --data /tmp/dependency-check-data --scan $CODE_IN --format JSON --format XML --format HTML --out $SBOM_OUT --enableExperimental"
      - "mv $SBOM_OUT/dependency-check-report.json $SBOM_OUT/dependency-check-vulns.json"

