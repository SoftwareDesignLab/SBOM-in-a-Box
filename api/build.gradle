plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.4'
}

group = 'org.svip'
version = '1.0.0-alpha'

application {
    mainClass.set('org.svip.api.SVIPApplication')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')
    implementation 'com.mikemybytes:junit5-formatted-source:1.0.1'
    implementation 'com.mysql:mysql-connector-j:9.3.0'
    implementation 'org.cyclonedx:cyclonedx-core-java:10.2.1'
    implementation 'org.springframework:spring-web:6.2.9'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.5.4'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.4'
    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'
    testImplementation 'org.springframework:spring-test:6.2.9'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
}

test {
    useJUnitPlatform()
}

sourceSets {
    test {
        java {
            srcDir 'test'
        }
    }
}

bootJar {
    mainClass.set('org.svip.api.SVIPApplication')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
    options.compilerArgs << '-Xlint:unchecked'
}

tasks.named('javadoc') {
    source = sourceSets.main.allJava
    options.memberLevel = JavadocMemberLevel.PRIVATE
}