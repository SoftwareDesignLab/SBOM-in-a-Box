# File: compose.yaml
# Description: create backend docker network for sbom-in-a-box application
#
# Author: Ian Dunn
# Author: Derek Garcia

name: sbom-in-a-box
services:
  # OSI container
  osi:
    container_name: osi
    platform: linux/amd64
    build: osi
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:5000/tools', timeout=5); sys.exit(0)\""]
      start_period: 60s   # allow validation to finish before first check
      interval: 20s
      timeout: 10s
      retries: 5

  # MySQL server
  sbox_db:
    container_name: sbox_db
    platform: linux/amd64
    image: mysql:8.4.6
    command: --max_allowed_packet=268435456  # Set max_allowed_packet to 256M
    env_file:
      - path: .env
        required: true
    environment:
      MYSQL_DATABASE: sbox
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?'MYSQL_ROOT_PASSWORD' must be set in the .env file}
      # create mysql user to use
      MYSQL_USER: ${MYSQL_USER:?'MYSQL_USER' must be set in the .env file}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?'MYSQL_PASSWORD' must be set in the .env file}
    volumes:
      - sbox_db:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 60s
      timeout: 5s
      retries: 3

  # SBOM-in-a-box API spring-boot application
  sbox_api:
    container_name: sbox_api
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: true
    environment:
      OSI_HOST: osi
      MYSQL_HOST: sbox_db
      MYSQL_DATABASE: sbox
      # create mysql user defined in the db
      MYSQL_USER: ${MYSQL_USER:?'MYSQL_USER' must be set in the .env file}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?'MYSQL_PASSWORD' must be set in the .env file}
    depends_on:
      sbox_db:
        condition: service_healthy
      osi:
        condition: service_healthy

volumes:
  sbox_db: